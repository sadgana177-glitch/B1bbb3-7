/* ---------- nets ---------- */
function wrapNet(shapes){
 var x0=1e9,y0=1e9,x1=-1e9,y1=-1e9,s='';
 shapes.forEach(function(sh){
  if(sh.pts){sh.pts.forEach(function(p){x0=Math.min(x0,p[0]);x1=Math.max(x1,p[0]);y0=Math.min(y0,p[1]);y1=Math.max(y1,p[1])});s+='<polygon class="nf" points="'+sh.pts.map(pt).join(' ')+'"/>'}
  else if(sh.c){var c=sh.c;x0=Math.min(x0,c[0]-c[2]);x1=Math.max(x1,c[0]+c[2]);y0=Math.min(y0,c[1]-c[2]);y1=Math.max(y1,c[1]+c[2]);s+='<circle class="nf" cx="'+c[0].toFixed(1)+'" cy="'+c[1].toFixed(1)+'" r="'+c[2]+'"/>'}
  else if(sh.d){x0=Math.min(x0,sh.bb[0]);y0=Math.min(y0,sh.bb[1]);x1=Math.max(x1,sh.bb[2]);y1=Math.max(y1,sh.bb[3]);s+='<path class="nf" d="'+sh.d+'"/>'}
 });
 var pad=8,w=x1-x0+2*pad,h=y1-y0+2*pad;
 return '<svg class="sv net" style="max-width:'+Math.round(Math.min(w*1.15,340))+'px" viewBox="'+(x0-pad).toFixed(1)+' '+(y0-pad).toFixed(1)+' '+w.toFixed(1)+' '+h.toFixed(1)+'" role="img" aria-label="شبكة مجسم">'+s+'</svg>';
}
function regPoly(n,cx,cy,R,flip){var o=[];for(var k=0;k<n;k++){var th=Math.PI/2-Math.PI/n+2*Math.PI*k/n;o.push([cx+R*Math.cos(th),cy+(flip?-1:1)*R*Math.sin(th)])}return o}
function prismNet(n){
 var s=rnd(32,40),h=rnd(46,66),sh=[],i;
 for(i=0;i<n;i++)sh.push({pts:[[i*s,0],[(i+1)*s,0],[(i+1)*s,h],[i*s,h]]});
 var R=s/(2*Math.sin(Math.PI/n)),a=s/(2*Math.tan(Math.PI/n));
 sh.push({pts:regPoly(n,s/2,-a,R,false)});
 sh.push({pts:regPoly(n,s/2,h+a,R,true)});
 return wrapNet(sh);
}
function pyramidNet(n){
 var s=rnd(34,42),ht=s*rnd(13,16)/10,R=s/(2*Math.sin(Math.PI/n)),V=regPoly(n,0,0,R,false),sh=[{pts:V}],i;
 for(i=0;i<n;i++){var a=V[i],b=V[(i+1)%n],m=[(a[0]+b[0])/2,(a[1]+b[1])/2],d=Math.hypot(m[0],m[1]),A=[m[0]+m[0]/d*ht,m[1]+m[1]/d*ht];sh.push({pts:[a,b,A]})}

}
function cylNet(){var r=rnd(18,24),w=2*Math.PI*r,h=rnd(52,70);return wrapNet([{pts:[[0,0],[w,0],[w,h],[0,h]]},{c:[w/2,-r,r]},{c:[w/2,h+r,r]}])}
function coneNet(){
 var R=rnd(64,78),r=rnd(19,25),al=2*Math.PI*r/R,x1=R*Math.cos(Math.PI/2+al/2),y1=R*Math.sin(Math.PI/2+al/2),x2=R*Math.cos(Math.PI/2-al/2),y2=y1;
 var wd=Math.max(R*Math.sin(al/2),r);
 return wrapNet([{d:'M0 0 L'+x1.toFixed(1)+' '+y1.toFixed(1)+' A'+R+' '+R+' 0 0 0 '+x2.toFixed(1)+' '+y2.toFixed(1)+' Z',bb:[-wd,0,wd,R]},{c:[0,R+r,r]}]);

/* cube nets by folding simulation */
function roll(d,dir){
 if(dir==='e')return {t:d.w,b:d.e,n:d.n,s:d.s,e:d.t,w:d.b};
 if(dir==='w')return {t:d.e,b:d.w,n:d.n,s:d.s,e:d.b,w:d.t};
 if(dir==='n')return {t:d.s,b:d.n,n:d.t,s:d.b,e:d.e,w:d.w};
 return {t:d.n,b:d.s,n:d.b,s:d.t,e:d.e,w:d.w};
}
function has2x2(cells){var S={};cells.forEach(function(c){S[c[0]+','+c[1]]=1});return cells.some(function(c){var r=c[0],q=c[1];return S[(r+1)+','+q]&&S[r+','+(q+1)]&&S[(r+1)+','+(q+1)]})}
function cubeCheck(cells){
 if(has2x2(cells))return {ok:false,why:'4'};
 var S={};cells.forEach(function(c){S[c[0]+','+c[1]]=1});
 var vis={},seen={},q=[{r:cells[0][0],c:cells[0][1],d:{t:0,b:1,n:2,s:3,e:4,w:5}}],cnt=1;
 vis[cells[0][0]+','+cells[0][1]]=1;seen[1]=1;
 var dirs=[[-1,0,'n'],[1,0,'s'],[0,1,'e'],[0,-1,'w']];
 while(q.length){var cur=q.shift();
  for(var j=0;j<4;j++){var nr=cur.r+dirs[j][0],nc=cur.c+dirs[j][1],k=nr+','+nc;
   if(!S[k]||vis[k])continue;vis[k]=1;cnt++;
   var d=roll(cur.d,dirs[j][2]);if(seen[d.b])return {ok:false,why:'dup'};seen[d.b]=1;q.push({r:nr,c:nc,d:d});}}
 return {ok:cnt===6&&Object.keys(seen).length===6,why:'x'};
}
function randHex(){
 var cells=[[0,0]],S={'0,0':1};
 while(cells.length<6){var c=pick(cells),d=pick([[1,0],[-1,0],[0,1],[0,-1]]),r=c[0]+d[0],q=c[1]+d[1];if(!S[r+','+q]){S[r+','+q]=1;cells.push([r,q])}}
 var mr=Math.min.apply(null,cells.map(function(c){return c[0]})),mc=Math.min.apply(null,cells.map(function(c){return c[1]}));
 return cells.map(function(c){return [c[0]-mr,c[1]-mc]});
}
function genCubeNets(){
 var good=[],bad=[],tries=0,key=function(c){return c.map(function(x){return x.join(',')}).sort().join('|')},seen={};
 while((good.length<3||bad.length<3)&&tries<4000){tries++;var c=randHex(),k=key(c);if(seen[k])continue;seen[k]=1;(cubeCheck(c).ok?good:bad).push(c)}
 var nv=rnd(1,3),arr=shuffle(good).slice(0,nv).map(function(c){return {cells:c,ok:true}}).concat(shuffle(bad).slice(0,4-nv).map(function(c){return {cells:c,ok:false}}));
 return shuffle(arr);
}
function genCubeNetsOne(){
 var g;for(var t=0;t<80;t++){g=genCubeNets();if(g.filter(function(x){return x.ok}).length===1)return g}
 return g;
}

  h+='<div class="dots" aria-label="أرقام الأسئلة">'+Q.qs.map(function(x,j){return '<button class="dot'+(x.sel!=null?' on':'')+(j===Q.i?' cur':'')+'" data-a="qgoto" data-j="'+j+'" aria-label="السؤال '+ar(j+1)+'">'+ar(j+1)+'</button>'}).join('')+'</div>';
  if(Q.warn)h+='<div class="msg bad">لم تجب عن '+ar(Q.qs.length-answered)+' أسئلة. اضغط «تسليم الآن» للإنهاء أو ارجع لإكمالها.<div class="ctl"><button class="btn" data-a="qsubmit">تسليم الآن</button><button class="btn ghost" data-a="qback">العودة للأسئلة</button></div></div>';
  h+='</div>';

 }
 var r=Q.res;
 h+='<div class="card" style="text-align:center"><div class="sub">نتيجة الطالب</div><h2 style="margin:4px 0">'+esc(Q.name)+'</h2><div class="score">'+ar(r.score)+' / '+ar(r.total)+'</div><p style="font-weight:600;margin-top:6px">'+r.msg+'</p><p class="sub">'+r.date+'</p><div class="ctl" style="justify-content:center"><button class="btn" data-a="qcopy">نسخ النتيجة</button><button class="btn ghost" data-a="qrestart">اختبار جديد بأرقام مختلفة</button></div><div id="copyMsg" class="note" role="status"></div></div>';
 h+='<div class="card" style="margin-top:16px"><h3 style="margin-bottom:6px">مراجعة الإجابات</h3>'+Q.qs.map(function(q,j){
  var okq=q.sel!=null&&q.opts[q.sel].ok,cor=q.opts.filter(function(o){return o.ok})[0],mine=q.sel!=null?q.opts[q.sel].p:'لم تجب';
  return '<div class="rv"><span class="st '+(okq?'y':'n')+'">'+(okq?'✓':'✗')+'</span><div><b>'+ar(j+1)+') '+q.plain+'</b><small>إجابتك: '+mine+'</small>'+(okq?'':'<small>الإجابة الصحيحة: '+cor.p+'</small>')+'<small>'+q.expl+'</small></div></div>';
 }).join('')+'</div>';
 h+='<div style="margin-top:18px">'+contact('eg')+'</div>';
 return h;

 h+='<div class="bar"><div class="tabs" role="tablist"><button class="tab" role="tab" aria-selected="'+(S.tab==='explain')+'" data-a="tab" data-t="explain">شرح تفاعلي</button><button class="tab" role="tab" aria-selected="'+(S.tab==='quiz')+'" data-a="tab" data-t="quiz">الاختبار</button></div><button class="btn ghost sm" data-a="logout">خروج</button></div>';

/* ---------- actions ---------- */
async function doLogin(){
 var v=$('#pw').value,hh=await H(v);
 if(hh===cfg.pw){S.view='home';S.tab='explain';S.unlocked=true;try{sessionStorage.setItem('mr_ok',cfg.pw)}catch(e){}resetCards();render();window.scrollTo(0,0)}
 else{$('#lerr').textContent='كلمة السر غير صحيحة، تأكد منها وحاول مرة أخرى.'}
}
async function doTeacher(stage){
 var T=S.t;
 if(stage===0){var h=await H($('#tc').value);if(h===cfg.tc){T.stage=1;T.msg='';T.ok=null}else{T.msg='رمز المعلم غير صحيح.';T.ok=false}render();return}
 var npw=norm($('#npw').value).trim(),ntc=norm($('#ntc').value).trim();
 if(!npw&&!ntc){T.msg='اكتب كلمة سر جديدة أو رمزًا جديدًا.';T.ok=false;render();return}
 if(npw&&npw.length<3){T.msg='كلمة السر قصيرة، اكتب ٣ أحرف أو أرقام على الأقل.';T.ok=false;render();return}
 T.busy=true;T.msg='جارٍ الحفظ…';T.ok=null;render();
 var c={v:Date.now(),pw:npw?await H(npw):cfg.pw,tc:ntc?await H(ntc):cfg.tc};
 try{await saveCfg(c);T.busy=false;T.msg='تم الحفظ. كلمة السر الجديدة تعمل الآن لجميع الطلاب.';T.ok=true;T.stage=1}
 catch(e){T.busy=false;T.ok=false;var code=e&&e.code;
  T.msg=(code==='not_writer'||code==='not_granted'||!code)?'هذا الرابط للعرض فقط. افتح الصفحة من حسابك صاحب الصفحة ثم غيّر كلمة السر.':code==='conflict'?'تم تحديث الصفحة من مكان آخر. أعد المحاولة بعد إعادة التحميل.':'تعذّر الحفظ الآن، حاول مرة أخرى بعد قليل.'}
 render();
}

 var v=($('#stuName').value||'').trim().replace(/\s+/g,' '),Q=S.quiz;Q.name=v;
 if(v.length<3||!/[\p{L}]/u.test(v)){Q.err='اكتب اسمك (٣ أحرف على الأقل) قبل بدء الاختبار.';Q.stage='name'}
 else{Q.err='';Q.stage='confirm'}
 render();
}
function finishQuiz(){
 var Q=S.quiz,sc=Q.qs.filter(function(q){return q.sel!=null&&q.opts[q.sel].ok}).length,d=new Date(),p=function(n){return ar(String(n).padStart(2,'0'))};
 var msg=sc>=9?'ممتاز، أداء رائع!':sc>=7?'جيد جدًا، استمر!':sc>=5?'جيد، راجع الشرح التفاعلي للأسئلة التي أخطأت فيها.':'راجع الشرح التفاعلي ثم أعد الاختبار.';
 Q.res={score:sc,total:Q.qs.length,msg:msg,date:p(d.getDate())+' / '+p(d.getMonth()+1)+' / '+ar(d.getFullYear())+'، '+p(d.getHours())+':'+p(d.getMinutes())};
 Q.stage='result';Q.warn=false;render();window.scrollTo(0,0);
}
function act(a,b){
 var i=+b.dataset.i,st=S.cards[i],Q=S.quiz;
 switch(a){
  case 'topen':S.t.open=!S.t.open;render();return;
  case 'logout':S.view='login';S.unlocked=false;try{sessionStorage.removeItem('mr_ok')}catch(e){}S.quiz=freshQuiz(S.quiz.name);render();window.scrollTo(0,0);return;
  case 'tab':S.tab=b.dataset.t;render();return;
  case 'next':st.step=(st.step||0)+1;rerenderCard(i);return;
  case 'all':st.step=99;rerenderCard(i);return;
  case 'new':S.cards[i]=CARDS[i].init();rerenderCard(i);return;
  case 'check':CARDS[i].check(st);rerenderCard(i);return;
  case 'as':st.as[+b.dataset.j]=b.dataset.v;st.done=false;st.msg='';rerenderCard(i);return;
  case 'pick':st.pick=+b.dataset.j;st.done=false;st.msg='';rerenderCard(i);return;
  case 'tog':st.sel[+b.dataset.j]=!st.sel[+b.dataset.j];st.done=false;st.msg='';rerenderCard(i);return;
  case 'setn':st.n=+b.dataset.n;rerenderCard(i);return;
  case 'qedit':Q.stage='name';render();return;
  case 'qgo':Q.qs=genQuiz();Q.i=0;Q.stage='run';Q.warn=false;render();window.scrollTo(0,0);return;
  case 'qpick':Q.qs[Q.i].sel=+b.dataset.j;Q.warn=false;render();return;
  case 'qprev':Q.i=Math.max(0,Q.i-1);Q.warn=false;render();return;
  case 'qnext':Q.i=Math.min(Q.qs.length-1,Q.i+1);render();return;
  case 'qgoto':Q.i=+b.dataset.j;Q.warn=false;render();return;
  case 'qfinish':if(Q.qs.some(function(q){return q.sel==null})){Q.warn=true;render()}else finishQuiz();return;
  case 'qsubmit':finishQuiz();return;
  case 'qback':Q.warn=false;render();return;
  case 'qrestart':S.quiz=freshQuiz(Q.name);S.quiz.stage='confirm';render();window.scrollTo(0,0);return;
  case 'qcopy':{
   var r=Q.res,txt='اختبار الأشكال ثلاثية الأبعاد (الصف السابع)\nالاسم: '+Q.name+'\nالنتيجة: '+ar(r.score)+' من '+ar(r.total)+'\n'+r.date,m=$('#copyMsg');
   var fail=function(){if(m)m.textContent='تعذّر النسخ تلقائيًا، انسخ النص يدويًا: '+txt.replace(/\n/g,' — ')};
   try{navigator.clipboard.writeText(txt).then(function(){if(m)m.textContent='تم نسخ النتيجة، أرسلها للمعلمة.'},fail)}catch(e){fail()}
   return;}
 }
}
function freshQuiz(name){return {stage:'name',name:name||'',err:'',qs:[],i:0,res:null,warn:false}}

app.addEventListener('click',function(e){var b=e.target.closest('[data-a]');if(b&&app.contains(b))act(b.dataset.a,b)});
app.addEventListener('submit',function(e){
 e.preventDefault();var id=e.target.id;
 if(id==='loginForm')doLogin();else if(id==='nameForm')doName();else if(id==='tForm0')doTeacher(0);else if(id==='tForm1')doTeacher(1);
});
app.addEventListener('input',function(e){
 var t=e.target;if(!t.dataset||t.dataset.in==null)return;
 t.value=ar(norm(t.value).replace(/\D/g,''));
 var i=+t.dataset.i,st=S.cards[i];if(CARDS[i].input)CARDS[i].input(st,t);
});
app.addEventListener('change',function(e){
 var t=e.target;if(!t.dataset||t.dataset.ch==null)return;
 var i=+t.dataset.i,st=S.cards[i];if(CARDS[i].change)CARDS[i].change(st,t);
});

resetCards();
render();
loadRemoteCfg().then(function(){
 try{if(sessionStorage.getItem('mr_ok')===cfg.pw&&S.view==='login'){S.view='home';S.unlocked=true;render()}}catch(e){}
});
})();
